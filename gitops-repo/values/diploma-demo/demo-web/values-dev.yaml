nameOverride: demo-web
replicaCount: 1
controller:
  labels:
    environment: dev
    stack: demo
    component: demo-web
podLabels:
  environment: dev
  stack: demo
  component: demo-web
image:
  repository: pok1sdiplomaacr.azurecr.io/diploma-demo-web
  tag: dev-initial
config:
  APP_NAME: diploma-demo-web
  APP_ENV: dev
  APP_VERSION: dev-initial
  DEPLOYMENT_TIMESTAMP: "2026-05-06T20:00:00Z"
  GIT_SHA: initial
  PORT: "8080"
secret:
  enabled: true
  data:
    EXAMPLE_API_TOKEN: demo-token-dev
ingress:
  enabled: true
  className: nginx
  host: dev.diploma-demo.local
resources:
  requests:
    cpu: 50m
    memory: 96Mi
  limits:
    cpu: 300m
    memory: 256Mi
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 3
  cpuAverageUtilization: 70
